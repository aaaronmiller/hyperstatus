model = "gpt-5.5"
model_reasoning_effort = "medium"
[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.4"
"gpt-5.4" = "gpt-5.5"

[tui.model_availability_nux]
"gpt-5.5" = 4

[tui]
status_line_use_colors = true
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
  "context-remaining",
  "context-window-size",
  "used-tokens",
  "total-output-tokens",
  "five-hour-limit",
  "weekly-limit",
]
terminal_title = [
  "project-name",
  "git-branch",
  "context-remaining",
  "run-state",
  "model-with-reasoning",
]
